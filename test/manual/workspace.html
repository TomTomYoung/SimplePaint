<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimplePaint 表示確認</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; }
  label, output { display: block; margin-bottom: 12px; }
  iframe { display: block; border: 1px solid #888; }
</style>
<label>画面サイズ
  <select id="size">
    <option value="390,844">スマートフォン 390 × 844</option>
    <option value="320,568">小型スマートフォン 320 × 568</option>
    <option value="768,1024">タブレット 768 × 1024</option>
    <option value="950,700">小さなウィンドウ 950 × 700</option>
    <option value="1366,768">デスクトップ 1366 × 768</option>
  </select>
</label>
<output id="result" aria-live="polite">読み込み中…</output>
<iframe id="preview" title="SimplePaint 動作確認" src="../../index.html" width="390" height="844"></iframe>
<script type="module">
  const frame = document.getElementById('preview');
  const size = document.getElementById('size');
  const output = document.getElementById('result');
  let observer;
  const measure = () => {
    const doc = frame.contentDocument;
    const area = doc.getElementById('canvasArea').getBoundingClientRect();
    const footer = doc.querySelector('footer').getBoundingClientRect();
    const sample = doc.querySelector('.brush-sample');
    const [width, height] = size.value.split(',').map(Number);
    const passed = area.width >= 100 && area.height >= 100 && area.top >= 0 &&
      area.right <= width && area.bottom <= height && footer.bottom <= height + 1 &&
      sample && frame.contentWindow.getComputedStyle(sample).position === 'static';
    output.textContent = `${passed ? 'PASS' : 'FAIL'}: キャンバス ${Math.round(area.width)} × ${Math.round(area.height)} / フッター下端 ${Math.round(footer.bottom)}（画面高 ${height}）`;
  };
  size.addEventListener('change', () => {
    [frame.width, frame.height] = size.value.split(',');
  });
  frame.addEventListener('load', () => {
    observer?.disconnect();
    observer = new ResizeObserver(measure);
    observer.observe(frame.contentDocument.getElementById('canvasArea'));
    measure();
  });
</script>
</html>
